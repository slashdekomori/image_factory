# RED OS 8 kickstart for Packer
text
eula --agreed

keyboard --vckeymap=ru --xlayouts='us','ru' --switch='grp:alt_shift_toggle'
lang ru_RU.UTF-8
timezone Europe/Moscow --utc

network --bootproto=dhcp --ipv6=auto --activate

cdrom

zerombr
clearpart --all --initlabel
autopart --type=plain --nohome
bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"

rootpw --plaintext --allow-ssh packer-temp-pass
services --enabled=sshd
firstboot --disable

reboot

%packages
@core
openssh-server
%end

%post
# Serial console for hypervisors (Proxmox serial0, libvirt, etc.)
# Show the GRUB menu and boot messages on both VGA and ttyS0.
sed -i '/^GRUB_TERMINAL_OUTPUT=/d' /etc/default/grub
grep -q '^GRUB_TERMINAL=' /etc/default/grub || \
  echo 'GRUB_TERMINAL="console serial"' >> /etc/default/grub
grep -q '^GRUB_SERIAL_COMMAND=' /etc/default/grub || \
  echo 'GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"' >> /etc/default/grub

# Keep the console arguments for future kernel updates.
grep -q 'console=ttyS0' /etc/default/grub || \
  sed -i 's/^GRUB_CMDLINE_LINUX="\(.*\)"/GRUB_CMDLINE_LINUX="\1 console=tty0 console=ttyS0,115200n8"/' /etc/default/grub

grub2-mkconfig -o /boot/grub2/grub.cfg

# Login prompt on the serial port.
systemctl enable serial-getty@ttyS0.service
%end
